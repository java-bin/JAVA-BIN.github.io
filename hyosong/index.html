// 기도원 방식: 바닥 클릭 시 자동 이동, 추모함 클릭 시 앞까지 걸어간 뒤 열기

renderer.domElement.addEventListener('pointerup',e=>{
 if(!dragStart||Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>8||activeMemorial)return;

});
function renderMemorialDetail(dt){if(!activeMemorial)return;if(activeMemorial.photoPlane?.material.map&&detailPhoto.material.map!==activeMemorial.photoPlane.material.map){detailPhoto.material.map=activeMemorial.photoPlane.material.map;detailPhoto.material.needsUpdate=true;}doorProgress+=(Number(doorsOpen)-doorProgress)*Math.min(1,dt*3.4);detailLeft.rotation.y=-doorProgress*1.32;detailRight.rotation.y=doorProgress*1.32;detailRenderer.render(detailScene,detailCamera);}
let followYaw=.35,followPitch=.24,camDistance=7.8,clock=new THREE.Clock();
// OrbitControls는 플레이어 추적 카메라와 충돌하므로 사용하지 않고 직접 시점 회전 처리
let cameraDrag=null;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,active:false};});
renderer.domElement.addEventListener('pointermove',e=>{if(!cameraDrag||cameraDrag.id!==e.pointerId)return;const dx=e.clientX-cameraDrag.x,dy=e.clientY-cameraDrag.y;if(Math.abs(dx)+Math.abs(dy)>0.6)followYaw-=dx*.0045;followPitch=Math.max(.12,Math.min(1.1,followPitch+dy*.003));cameraDrag.x=e.clientX;cameraDrag.y=e.clientY;});
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{if(cameraDrag?.id===e.pointerId)cameraDrag=null});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camDistance=Math.max(2.8,Math.min(16.0,camDistance+Math.sign(e.deltaY)*.65))},{passive:false});
// 터치 핀치 줌
let pinchDist=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length!==2){pinchDist=0;return;}const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinchDist)camDistance=Math.max(2.8,Math.min(16.0,camDistance+(pinchDist-dist)*.012));pinchDist=dist;},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinchDist=0);

// 기존 OrbitControls 렌더 루프를 대체하여 3인칭 추적 카메라로 렌더링
function playFrame(){requestAnimationFrame(playFrame);const dt=Math.min(clock.getDelta(),.045);if(activeMemorial){renderMemorialDetail(dt);return;}updateClinicCat(dt);let forward=0,strafe=0;
 if(pressed.has('up'))forward+=1;if(pressed.has('down'))forward-=1;
 if(pressed.has('left'))strafe-=1;if(pressed.has('right'))strafe+=1;
 if(forward||strafe){walkTarget=null;pendingMemorial=null;}
 if(!forward&&!strafe&&walkTarget){const dd=walkTarget.clone().sub(dog.position);dd.y=0;const dist=dd.length();if(dist<.22){walkTarget=null;if(pendingMemorial){const item=pendingMemorial;pendingMemorial=null;openMemorial(item);}}else{const v=dd.normalize();forward=-v.x*Math.sin(followYaw)-v.z*Math.cos(followYaw);strafe=v.x*Math.cos(followYaw)-v.z*Math.sin(followYaw);}}
 const l=Math.hypot(forward,strafe);
 dogMoving=false;
 if(l){forward/=l;strafe/=l;
 // 카메라가 바라보는 방향을 기준으로 위=전진, 아래=후진, 좌우=횡이동
 const dx=(-Math.sin(followYaw)*forward+Math.cos(followYaw)*strafe);
 const dz=(-Math.cos(followYaw)*forward-Math.sin(followYaw)*strafe);
 const nx=dog.position.x+dx*11.0*dt,nz=dog.position.z+dz*11.0*dt;
 const inBounds=nx>-10.5&&nx<10.5&&nz>-25.7&&nz<19.0;
 const insideDesk=nx>-4.15&&nx<4.15&&nz>-1.65&&nz<-.50;
 const insideGuard=(nx>8.22&&nx<8.68&&nz>2.85&&nz<5.65)||(nx>8.45&&nx<10.2&&(nz>2.8&&nz<3.2||nz>5.3&&nz<5.7));
 // 가구 충돌: 새로 배치한 실제 크기만 사용

 const blockedFurniture=(x,z)=>{
  const radius=.23;
  const boxes=[
   [-5.5,-14.4,1.5,3.6], // 수술대
   [-.42,-13.0,.46,1.65],[-.39,-14.4,.14,1.05],
   [-4.05,-13.0,.8,.8], // 벽 쪽 원장
   [-.55,-17.4,.52,.80],[-10.35,-19.6,.58,1.25], // 벽 부착 의료기기
   [4.15,-13.7,1.7,4.55], // 검은 조제대
   // 후면 책상 없음
   [.65,-10.5,.7,2.9],[.65,-14.0,.7,2.9],[.66,-18.15,.7,2.2], // 벽 선반
   [SCALE_X,SCALE_Z,1.02,1.96]
  ];
  return boxes.some(([cx,cz,w,d])=>Math.abs(x-cx)<w/2+radius&&Math.abs(z-cz)<d/2+radius);
 };
 const canWalk=(x,z,oldX,oldZ)=>{
  if(x<=-10.45||x>=10.45||z<=-25.65||z>=19.0)return false;
  if(x>-4.15&&x<4.15&&z>-1.65&&z<-.50)return false;
  // ㄷ자 가드의 실측 충돌 범위. 중앙 통로(2.9~5.6)는 열어 둔다.
  if((Math.abs(x-8.65)<.30 && ((z>1.82&&z<3.48)||(z>5.02&&z<6.68))) ||
     ((z>1.65&&z<2.15||z>6.35&&z<6.85)&&x>8.4&&x<9.5))return false;
  // 중앙 분리벽: 후면 -24.75 ~ -22.2 사이에서만 횡단 가능
  if(z< -3.55 && z> -22.2 && Math.abs(x)<.39)return false;
  if(z< -24.75 && Math.abs(x)<.39)return false;
  // 로비와 각 방 사이에서는 양쪽 아치 입구만 통과
  if((oldZ+3.55)*(z+3.55)<=0 && !(Math.abs(x+7.1)<1.35||Math.abs(x-7.1)<1.35))return false;
  return !blockedFurniture(x,z);
 };
  const ox=dog.position.x,oz=dog.position.z;
  if(canWalk(nx,nz,ox,oz))dog.position.set(nx,0,nz);
  else if(canWalk(nx,oz,ox,oz))dog.position.x=nx;

 dog.rotation.y=Math.atan2(dx,dz);
 }
 if(dogMoving){dogWalkTime+=dt;movePaws(dogFeet,dogWalkTime*13,.105,.075);}
 else {movePaws(dogFeet,0,0,0);}
 // 접근 즉시 열기, 범위를 벗어나면 닫기. 이동과 렌더링은 계속 진행.

 else if(lastNearTarget!==nearInfo.id){lastNearTarget=nearInfo.id;showPaper(nearInfo);}
 // 자동문: 접근 시 열리고 멀어지면 닫힌다. 기본 상태는 닫힘.
 const nearEntrance=Math.abs(dog.position.x-entranceX)<3.0&&Math.abs(dog.position.z-entranceZ)<2.1;
 automaticDoorOpen+=(Number(nearEntrance)-automaticDoorOpen)*Math.min(1,dt*5.5);
 autoDoorL.position.z=-1.62*automaticDoorOpen;
 autoDoorR.position.z=1.62*automaticDoorOpen;
 tail.rotation.z=Math.sin(clock.elapsedTime*12)*.45;
 const targetCam=new THREE.Vector3(dog.position.x+Math.sin(followYaw)*camDistance*Math.cos(followPitch),1.05+Math.sin(followPitch)*camDistance,dog.position.z+Math.cos(followYaw)*camDistance*Math.cos(followPitch));// 카메라 좌표를 방 경계에 강제로 고정하지 않는다. 벽은 아래에서 시야에 따라 투명 처리.

 // 추모함 벽 뒤로 카메라가 넘어가면 명패/사진이 거울처럼 보인다.
 // 추모관에서는 전시벽 앞쪽에 카메라를 유지한다.
 if(dog.position.z>7.0)camera.position.z=Math.min(camera.position.z,17.35);
 camera.lookAt(dog.position.x,1.05,dog.position.z);
 const lookTarget=new THREE.Vector3(dog.position.x,1.05,dog.position.z);const delta=camera.position.clone().sub(lookTarget);cameraRay.set(lookTarget,delta.clone().normalize());cameraRay.far=delta.length();
 const blocked=new Set(cameraRay.intersectObjects(cameraObstacles,false).map(h=>h.object));for(const wall of cameraObstacles){const nearCamera=wall.geometry?.boundingBox?false:camera.position.distanceTo(wall.position)<2.2;const desired=(blocked.has(wall)||nearCamera)?.025:(wall===roof?.92:1);wall.material.opacity+=(desired-wall.material.opacity)*Math.min(1,dt*12);wall.visible=wall.material.opacity>.018;}

}

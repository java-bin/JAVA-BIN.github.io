function renderMemorialDetail(dt){if(!activeMemorial)return;if(activeMemorial.photoPlane?.material.map&&detailPhoto.material.map!==activeMemorial.photoPlane.material.map){detailPhoto.material.map=activeMemorial.photoPlane.material.map;detailPhoto.material.needsUpdate=true;}doorProgress+=(Number(doorsOpen)-doorProgress)*Math.min(1,dt*3.4);detailLeft.rotation.y=-doorProgress*1.32;detailRight.rotation.y=doorProgress*1.32;detailRenderer.render(detailScene,detailCamera);}
let followYaw=.35,followPitch=.24,camDistance=7.8,clock=new THREE.Clock();

// 기존 OrbitControls 렌더 루프를 대체하여 3인칭 추적 카메라로 렌더링
function playFrame(){requestAnimationFrame(playFrame);const dt=Math.min(clock.getDelta(),.045);if(activeMemorial){renderMemorialDetail(dt);return;}updateClinicCat(dt);let forward=0,strafe=0;
 if(pressed.has('up'))forward+=1;if(pressed.has('down'))forward-=1;

 if(!forward&&!strafe&&walkTarget){const dd=walkTarget.clone().sub(dog.position);dd.y=0;const dist=dd.length();if(dist<.22){if(walkQueue.length){walkTarget=walkQueue.shift();}else{walkTarget=null;navLoose=false;if(pendingMemorial){const item=pendingMemorial;pendingMemorial=null;openMemorial(item);}else if(pendingHot){const k=pendingHot;pendingHot=null;openPanel(k);}}}else{const v=dd.normalize();forward=-v.x*Math.sin(followYaw)-v.z*Math.cos(followYaw);strafe=v.x*Math.cos(followYaw)-v.z*Math.sin(followYaw);}}

 if(l){forward/=l;strafe/=l;
 // 카메라가 바라보는 방향을 기준으로 위=전진, 아래=후진, 좌우=횡이동

 const nx=dog.position.x+dx*11.0*dt,nz=dog.position.z+dz*11.0*dt;

 const insideDesk=nx>-4.15&&nx<4.15&&nz>-1.65&&nz<-.50;
 const insideGuard=(nx>8.22&&nx<8.68&&nz>2.85&&nz<5.65)||(nx>8.45&&nx<10.2&&(nz>2.8&&nz<3.2||nz>5.3&&nz<5.7));
 // 가구 충돌: 새로 배치한 실제 크기만 사용
 // 실제 배치된 가구만 충돌. 빨간 동선과 후면 연결로는 비워 둔다.
 const blockedFurniture=(x,z)=>{if(navLoose)return false;
  const radius=.23;
  const boxes=[...VET.blocked,
   [-5.5,-14.4,1.5,3.6], // 수술대
   [-.42,-13.0,.46,1.65],[-.39,-14.4,.14,1.05],
   [-4.05,-13.0,.8,.8], // 벽 쪽 원장
   [-10.35,-19.6,.58,1.25], // 벽 부착 의료기기
   [4.15,-13.7,1.7,4.55], // 검은 조제대

   [.65,-10.5,.7,2.9],[.65,-14.0,.7,2.9],[.66,-18.15,.7,2.2], // 벽 선반
   [SCALE_X,SCALE_Z,1.02,1.96]
  ];
  return boxes.some(([cx,cz,w,d])=>Math.abs(x-cx)<w/2+radius&&Math.abs(z-cz)<d/2+radius);
 };
 const canWalk=(x,z,oldX,oldZ)=>{
  const segDist=(px,pz,a,b)=>{const dx=b[0]-a[0],dz=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz)));return Math.hypot(px-a[0]-t*dx,pz-a[1]-t*dz)};
  if(z<=-25.65&&x>-6.95&&x<11.2){if(z>-26.45)return (x>-4.2&&x<-2.8)||(x>3.2&&x<8.8);if(!wardPoly(x,z))return false;for(let i=1;i<WARD.length;i++){if(segDist(x,z,WARD[i],WARD[(i+1)%WARD.length])<.5)return false}return !blockedFurniture(x,z);}
  if(x<=-11.4||x>=11.4||z<=-26.6||z>=20.6){return Math.abs(x)<75&&z>-75&&z<75;}
  if(x>10.4&&x<11.4&&z>3.0&&z<5.5)return true;
  if(x<=-10.45||x>=10.45||z<=-25.65||z>=19.0)return false;
  if(x>-4.15&&x<4.15&&z>-1.65&&z<-.50)return false;
  // ㄷ자 가드의 실측 충돌 범위. 중앙 통로(2.9~5.6)는 열어 둔다.
  if((Math.abs(x-8.65)<.30 && ((z>1.82&&z<3.48)||(z>5.02&&z<6.68))) ||
     ((z>1.65&&z<2.15||z>6.35&&z<6.85)&&x>8.4&&x<9.5))return false;
  // 중앙 분리벽: 후면 -24.75 ~ -22.2 사이에서만 횡단 가능
  if(z< -3.55 && z> -26.1 && Math.abs(x)<.39)return false;
  if(z< -24.75 && Math.abs(x)<.39)return false;
  // 로비와 각 방 사이에서는 양쪽 아치 입구만 통과
  if((oldZ+3.55)*(z+3.55)<=0 && !(Math.abs(x+7.1)<1.0||Math.abs(x-7.1)<1.0))return false;

 };
  const ox=dog.position.x,oz=dog.position.z;

 dog.rotation.y=Math.atan2(dx,dz);
 }

 // 접근 즉시 열기, 범위를 벗어나면 닫기. 이동과 렌더링은 계속 진행.

 autoDoorL.position.z=-1.62*automaticDoorOpen;
 autoDoorR.position.z=1.62*automaticDoorOpen;

 const targetCam=new THREE.Vector3(dog.position.x+Math.sin(followYaw)*camDistance*Math.cos(followPitch),1.05+Math.sin(followPitch)*camDistance,dog.position.z+Math.cos(followYaw)*camDistance*Math.cos(followPitch));// 카메라 좌표를 방 경계에 강제로 고정하지 않는다. 벽은 아래에서 시야에 따라 투명 처리.

 const lookTarget=new THREE.Vector3(dog.position.x,1.05,dog.position.z);const delta=camera.position.clone().sub(lookTarget);cameraRay.set(lookTarget,delta.clone().normalize());cameraRay.far=delta.length();
 try{const blocked=new Set(cameraRay.intersectObjects(cameraObstacles,false).map(h=>h.object));for(const wall of cameraObstacles){const nearCamera=wall.geometry?.boundingBox?false:camera.position.distanceTo(wall.position)<2.2;const desired=(blocked.has(wall)||nearCamera)?.025:(wall===roof?.92:1);wall.material.opacity+=(desired-wall.material.opacity)*Math.min(1,dt*12);wall.visible=wall.material.opacity>.018;}}catch(e){showErr('camera: '+e.message)}
 try{renderer.render(scene,camera)}catch(e){showErr('render: '+e.message)}
}

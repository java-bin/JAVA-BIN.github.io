<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="채소 CBT: 정보보안기사 실기 분야별 연습 1,000문항, 키워드 채점, 오답노트와 저장한 문제">
  <title>채소 CBT · 보안기사 실기</title>
  <link rel="icon" type="image/png" href="mascot.png?v=2">
  <link rel="apple-touch-icon" href="mascot.png?v=2">
</head>
<body style="margin:0">
<div id="chaechae-preview">
  <style>
    #chaechae-preview {
      --page: light-dark(#f5f7fb, #151a24);
      --panel: light-dark(#ffffff, #202735);
      --ink: light-dark(#17243b, #edf2ff);
      --muted: light-dark(#64748b, #a5b2c8);
      --line: light-dark(#e4e9f2, #354155);
      --brand: light-dark(#385ee8, #8ca6ff);
      --soft: light-dark(#eef2ff, #2b3757);
      --good: light-dark(#17754e, #80d6af);
      color: var(--ink);
      font-family: system-ui, 'Apple SD Gothic Neo', sans-serif;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      font-size: 14px
    }

    #chaechae-preview * {
      box-sizing: border-box
    }

    #chaechae-preview button, #chaechae-preview textarea {
      font: inherit
    }

    #chaechae-preview button {
      cursor: pointer
    }

    #chaechae-preview .shell {
      display: grid;
      grid-template-columns:205px minmax(0, 1fr)
    }

    #chaechae-preview aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 26px 18px
    }

    #chaechae-preview .brand {
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    #chaechae-preview .logo {
      background: var(--brand);
      color: var(--panel);
      width: 33px;
      height: 33px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 16px
    }

    #chaechae-preview .caption {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 0 30px
    }

    #chaechae-preview .nav-label {
      color: var(--muted);
      font-size: 12px;
      margin: 22px 8px 10px
    }

    #chaechae-preview .side-button {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 13px 10px;
      margin: 5px 0
    }

    #chaechae-preview .side-button.active {
      background: var(--soft);
      color: var(--brand)
    }

    #chaechae-preview .later {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      margin-top: 42px;
      padding-top: 18px
    }

    #chaechae-preview main {
      padding: 28px 32px 32px;
      min-width: 0
    }

    #chaechae-preview .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 28px
    }

    #chaechae-preview h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -1.2px;
      margin: 0 0 10px
    }

    #chaechae-preview h2 {
      font-size: 16px;
      font-weight: 500;
      margin: 28px 0 13px
    }

    #chaechae-preview .intro {
      color: var(--muted);
      margin: 0 0 22px
    }

    #chaechae-preview .grid {
      display: grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    #chaechae-preview .subject {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      padding: 19px 14px;
      text-align: left;
      min-height: 94px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background .15s
    }

    #chaechae-preview .subject:hover {
      background: var(--soft)
    }

    #chaechae-preview .subject small {
      color: var(--muted);
      font-size: 12px
    }

    #chaechae-preview .subject.random {
      background: var(--soft);
      border-color: var(--brand)
    }

    #chaechae-preview .years {
      display: flex;
      flex-wrap: wrap;
      gap: 9px
    }

    #chaechae-preview .year, #chaechae-preview .secondary {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 11px 16px
    }

    #chaechae-preview .foot {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted)
    }

    #chaechae-preview .back {
      background: none;
      border: 0;
      padding: 0;
      color: var(--muted);
      margin-bottom: 20px
    }

    #chaechae-preview .question {
      background: var(--panel);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px
    }

    #chaechae-preview .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--muted)
    }

    #chaechae-preview .tag {
      background: var(--soft);
      color: var(--brand);
      padding: 4px 8px;
      border-radius: 5px
    }

    #chaechae-preview .prompt {
      font-size: 17px;
      line-height: 1.7;
      margin: 0 0 16px;
      font-weight: 500
    }

    #chaechae-preview .format {
      background: var(--page);
      color: var(--muted);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7
    }

    #chaechae-preview label {
      display: block;
      margin: 20px 0 9px
    }

    #chaechae-preview textarea {
      width: 100%;
      resize: vertical;
      min-height: 118px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--ink);
      line-height: 1.7;
      font-size: 16px
    }

    #chaechae-preview .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 17px
    }

    #chaechae-preview .primary {
      border: 0;
      border-radius: 9px;
      background: var(--brand);
      color: light-dark(#fff, #142044);
      padding: 12px 23px;
      font-weight: 500
    }

    #chaechae-preview .result {
      margin-top: 18px;
      padding: 15px;
      border-radius: 9px;
      background: var(--soft);
      line-height: 1.8
    }

    #chaechae-preview .result b {
      font-weight: 500
    }

    #chaechae-preview .result small {
      display: block;
      color: var(--muted)
    }

    #chaechae-preview [hidden] {
      display: none !important
    }

    #chaechae-preview .side-status {
      color: var(--muted);
      font-size: 12px;
      padding: 8px
    }

    @media (max-width: 650px) {
      #chaechae-preview .shell {
        grid-template-columns:1fr
      }

      #chaechae-preview aside {
        padding: 15px 20px;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      #chaechae-preview .brand {
        font-size: 20px
      }

      #chaechae-preview .caption, #chaechae-preview .nav-label, #chaechae-preview .later, #chaechae-preview .side-status {
        display: none
      }

      #chaechae-preview .side-links {
        display: flex;
        flex-wrap: wrap;
        margin-top: 10px;
        gap: 4px
      }

      #chaechae-preview .side-button {
        width: auto;
        padding: 9px;
        font-size: 12px;
        margin: 0
      }

      #chaechae-preview main {
        padding: 22px 18px
      }

      #chaechae-preview .grid {
        grid-template-columns:repeat(2, minmax(0, 1fr))
      }

      #chaechae-preview h1 {
        font-size: 25px
      }

      #chaechae-preview .top {
        margin-bottom: 20px
      }

      #chaechae-preview .question {
        padding: 18px
      }

      #chaechae-preview .actions {
        flex-wrap: wrap
      }
    }

    #chaechae-preview {
      border: 0;
      border-radius: 0;
      color-scheme: light dark;
      min-height: 100dvh
    }

    #chaechae-preview .shell {
      min-height: 100dvh;
      max-width: 1300px;
      margin: auto
    }

    #chaechae-preview aside {
      padding-top: 32px
    }

    #chaechae-preview main {
      padding-top: 32px
    }

    #chaechae-preview .quiz-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px
    }

    #chaechae-preview .quiz-toolbar .back {
      margin: 0
    }

    #chaechae-preview .result a {
      color: var(--brand)
    }

    #chaechae-preview .checks {
      padding: 0;
      list-style: none
    }

    #chaechae-preview .checks li {
      padding: 5px 0
    }

    #chaechae-preview .muted {
      color: var(--muted)
    }

    #chaechae-preview #source-panel, #chaechae-preview #collection-panel {
      margin-top: 20px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px
    }

    #chaechae-preview .collection-item {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 14px 4px
    }

    #chaechae-preview #notice {
      color: var(--muted);
      margin-bottom: 12px
    }

    #chaechae-preview button:disabled {
      opacity: .4;
      cursor: default
    }

    #chaechae-preview textarea:focus {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    #chaechae-preview .result {
      overflow-wrap: anywhere
    }

    #chaechae-preview .subject small {
      line-height: 1.5
    }

    #chaechae-preview .subject {
      min-height: 106px
    }

    #chaechae-preview .status-label {
      font-size: 17px;
      font-weight: 500
    }

    #chaechae-preview .foot {
      line-height: 1.7
    }

    #chaechae-preview #source-panel a {
      color: var(--brand)
    }

    @media (max-width: 650px) {
      #chaechae-preview main {
        padding-top: 20px
      }

      #chaechae-preview aside {
        padding-top: 18px
      }
    }

    #chaechae-preview .mascot {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0
    }

    #chaechae-preview .caption {
      line-height: 1.7;
      overflow-wrap: anywhere
    }

    #chaechae-preview .top {
      align-items: center
    }

    #chaechae-preview .top .tiny-mascot {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 7px
    }
    #chaechae-preview .shell {
      width: 100%;
      max-width: none;
      margin: 0;
      grid-template-columns: clamp(190px, 18vw, 260px) minmax(0, 1fr);
    }

    @media (max-width: 650px) {
      #chaechae-preview .shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <div class="shell">
    <aside>
      <div class="brand"><img class="mascot" src="mascot.png" alt="채소 CBT 배추 캐릭터">채소 CBT</div>
      <p class="caption">만약 기술이 보안 문제를 해결할 수 있다고 생각한다면, 당신은 문제를 제대로 이해하지 못하고 있는 것이며, 기술 자체를 이해하지 못하는 것입니다</p>
      <div class="nav-label">시험 선택</div>
      <div class="side-links">
        <button class="side-button active" data-home>정보보안기사 실기</button>
        <button class="side-button" data-side="오답노트">오답노트</button>
        <button class="side-button" data-side="저장한 문제">저장한 문제</button>
      </div>
      <div class="side-status" aria-live="polite"></div>
      <div class="later">정보보안기사 실기</div>
    </aside>
    <main>
      <div class="top"><span>정보보안기사 / 실기</span><span></span></div>
      <section data-home-view><h1>보안기사 실기</h1>
        <div id="notice" role="status" aria-live="polite"></div>
        <p class="intro">분야를 골라 집중하거나, 1,000개 연습문제를 섞어 풀어보세요.</p>
        <h2>분야별 문제</h2>
        <div class="grid">
          <button class="subject" data-subject="시스템보안"><span>시스템보안</span><small>Linux · Windows · 접근통제</small></button>
          <button class="subject" data-subject="네트워크보안"><span>네트워크보안</span><small>프로토콜 · 공격 · 보안 장비</small></button>
          <button class="subject" data-subject="애플리케이션보안"><span>애플리케이션보안</span><small>웹 · 데이터베이스 · 취약점</small></button>
          <button class="subject" data-subject="정보보안일반"><span>정보보안일반</span><small>암호 · 인증 · 보안 모델</small></button>
          <button class="subject" data-subject="정보보안관리 및 법규"><span>정보보안관리 및 법규</span><small>관리체계 · 위험관리 · 법규</small>
          </button>
          <button class="subject random" data-subject="전체랜덤"><span>전체랜덤 ↗</span><small>모든 분야에서 섞어서 출제</small></button>
        </div>
        <h2>회차별 기출 · 일부 복원</h2>
        <div class="years">
          <button class="year" data-year="2021년 제17회">2021년 제17회 · 일부 복원</button>
          <button class="year" data-year="2017년 제10회">2017년 제10회 · 일부 복원</button>
        </div>
        <p class="foot">분야별 연습 1,000문항 · 과목별 200문항<br></p>
        <div id="source-panel" hidden></div>
        <div id="collection-panel" hidden></div>
      </section>
      <section data-quiz-view hidden>
        <div class="quiz-toolbar">
          <button class="back" data-back>← 목록으로</button>
          <button class="secondary" id="bookmark">☆ 저장</button>
        </div>
        <div class="question">
          <div class="meta"><span class="tag" data-category>정보보안일반</span><span><span id="quiz-progress"></span></span>
          </div>
          <p class="prompt" data-prompt></p>
          <div class="format" data-format></div>
          <label for="cc-answer">나의 답안</label><textarea id="cc-answer" placeholder="답안을 직접 작성하세요."></textarea>
          <div class="actions">
            <button class="secondary" data-model>모범답안 보기</button>
            <button class="primary" data-grade>정답 확인하기</button>
            <button class="secondary" id="submit-session">제출하기</button>
          </div>
          <div class="actions">
            <button class="secondary" id="previous">← 이전</button>
            <button class="secondary" id="next">다음 →</button>
          </div>
          <div class="result" data-result hidden aria-live="polite"></div>
        </div>
      </section>
      <section id="submission-view" hidden aria-live="polite"></section>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

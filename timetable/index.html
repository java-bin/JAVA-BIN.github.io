<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>동해선 시간표 검색</title>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2937;
            background: #f5f7fb
        }

        body {
            margin: 0;
            padding: 24px
        }

        .wrap {
            max-width: 760px;
            margin: auto
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .07)
        }

        h1 {
            font-size: 24px;
            margin: 0 0 6px
        }

        .sub {
            color: #6b7280;
            margin: 0 0 20px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        label {
            font-size: 13px;
            font-weight: 700
        }

        select,
        button {
            font: inherit;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px;
            background: #fff
        }

        button {
            background: #111827;
            color: #fff;
            border: 0;
            font-weight: 700;
            cursor: pointer
        }

        .wide {
            grid-column: 1/-1
        }

        .swap {
            background: #eef2ff;
            color: #3730a3
        }

        .results {
            margin-top: 20px
        }

        .trip {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: 14px 4px;
            border-bottom: 1px solid #eee
        }

        .time {
            font-size: 21px;
            font-weight: 800
        }

        .right {
            text-align: right
        }

        .meta {
            text-align: center;
            color: #6b7280;
            font-size: 12px
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 999px;
            padding: 4px 8px;
            margin-top: 4px
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #6b7280
        }

        @media(max-width:520px) {
            body {
                padding: 12px
            }

            .grid {
                grid-template-columns: 1fr
            }

            .wide {
                grid-column: auto
            }

            .trip {
                gap: 6px
            }

            .time {
                font-size: 18px
            }
        }
    </style>
</head>

                res.innerHTML = '<div class="empty">조건에 맞는 열차가 없사옵니다.</div>';
                return;
            }
            var html = '<div style="font-weight:800;margin-bottom:8px">' + day.value + ' · ' + from.value + ' → ' + to.value + ' <span style="color:#6b7280;font-weight:500">(' + rows.length + '편)</span></div>';
            for (var j = 0; j < rows.length; j++) {
                var x = rows[j];
                html += '<div class="trip"><div><div class="time">' + fmt(x.dep) + '</div><div>' + from.value + '</div></div><div class="meta">' + x.train + '<br><span class="badge">약 ' + dur(x.arr - x.dep) + '</span></div><div class="right"><div class="time">' + fmt(x.arr) + '</div><div>' + to.value + '</div></div></div>';
            }
            res.innerHTML = html;
        }
        function swapStations() {
            var x = from.value;
            from.value = to.value;
            to.value = x;
            if (from.value && to.value) run();
        }
    </script>
